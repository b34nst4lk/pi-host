<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>THE WALL</title>
    <style>
      :root {
        --bg: #0b0d10;
        --panel: #14181d;
        --line: #232a32;
        --ink: #e6edf3;
        --dim: #7d8b99;
        --live: #3fb950;
        --slow: #d29922;
        --stale: #f85149;
        --accent: #58a6ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .wall { max-width: 1100px; margin: 0 auto; padding: 24px 20px 48px; }
      .head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
      .title { font-size: 18px; letter-spacing: 0.22em; margin: 0; font-weight: 600; }
      .mode { color: var(--dim); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
      .banner {
        border: 1px solid var(--stale);
        color: var(--stale);
        padding: 8px 10px;
        margin-bottom: 14px;
        border-radius: 4px;
        overflow-wrap: anywhere;
      }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
      .card-title {
        font-size: 11px;
        letter-spacing: 0.18em;
        color: var(--dim);
        margin: 0 0 12px;
        font-weight: 600;
      }
      .stat { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
      .stat-label { color: var(--dim); }
      .stat-value { font-variant-numeric: tabular-nums; }
      .muted { color: var(--dim); margin: 6px 0; }
      .spark { display: block; width: 100%; height: 24px; color: var(--accent); margin: 8px 0; }
      .budget { margin: 10px 0; }
      .budget-head { display: flex; justify-content: space-between; }
      .budget-track { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
      .budget-fill { height: 100%; background: var(--live); transition: width 0.4s ease; }
      .badge {
        display: inline-block;
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 1px 6px;
        margin-top: 8px;
        color: var(--dim);
      }
      .badge.cached { color: var(--slow); border-color: var(--slow); }
      .badge.stale { color: var(--stale); border-color: var(--stale); }
      .badge.state-working { color: var(--accent); border-color: var(--accent); }
      .badge.state-queued { color: var(--slow); border-color: var(--slow); }
      .badge.state-reporting { color: var(--accent); border-color: var(--line); }
      .badge.state-alive { color: var(--live); border-color: var(--live); }
      .badge.state-orphaned { color: var(--stale); border-color: var(--stale); }
      .badge.state-retired, .badge.state-unknown { color: var(--dim); border-color: var(--line); }
      .work-line { margin: 0 0 10px; font-size: 11px; letter-spacing: 0.06em; color: var(--ink); }
      .agents { display: grid; gap: 10px; }
      .agent { border-top: 1px solid var(--line); padding-top: 8px; }
      .agent:first-child { border-top: none; padding-top: 0; }
      .agent-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      .agent-head .badge { margin-top: 0; }
      .agent-name { color: var(--accent); }
      .agent-branch, .agent-worktree, .agent-reply { color: var(--dim); font-size: 11px; }
      .agent-worktree, .orphan-ids { overflow-wrap: anywhere; }
      .orphans {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--dim);
      }
      .orphan-count { color: var(--slow); }
      .last-error { color: var(--stale); font-size: 11px; overflow-wrap: anywhere; margin: 10px 0 0; }
      .errors { margin: 10px 0 0; padding-left: 16px; color: var(--dim); font-size: 11px; }
      .hidden { display: none; }
      /* --- tabs ------------------------------------------------------- */
      .tabs { display: flex; gap: 6px; }
      .tab {
        background: none;
        border: 1px solid var(--line);
        border-radius: 3px;
        color: var(--dim);
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        letter-spacing: 0.12em;
        padding: 2px 8px;
      }
      .tab.active { color: var(--ink); border-color: var(--accent); }
      /* --- the LOGS browser ------------------------------------------- */
      .logs { display: grid; gap: 10px; }
      .log-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      .chips { display: flex; flex-wrap: wrap; gap: 4px; }
      .chip {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 3px;
        color: var(--dim);
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        padding: 2px 7px;
      }
      .chip.active { color: var(--bg); background: var(--accent); border-color: var(--accent); }
      .search {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 3px;
        color: var(--ink);
        font: inherit;
        font-size: 12px;
        padding: 3px 8px;
        flex: 1 1 180px;
        min-width: 120px;
      }
      .older {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 3px;
        color: var(--dim);
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        padding: 2px 8px;
      }
      .log-line { margin: 0; color: var(--dim); font-size: 11px; letter-spacing: 0.06em; }
      .log-rows { display: grid; gap: 2px; }
      .log-row { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; }
      .log-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; cursor: pointer; }
      .log-at { color: var(--dim); font-variant-numeric: tabular-nums; }
      .log-kind { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
      .kind-user { color: var(--live); }
      .kind-assistant { color: var(--accent); }
      .kind-tool { color: var(--slow); }
      .kind-compaction, .kind-system { color: var(--dim); }
      .kind-app { color: var(--stale); }
      .log-thread { color: var(--accent); font-size: 11px; }
      .log-text { flex: 1 1 240px; overflow-wrap: anywhere; }
      .log-raw, .spill-body {
        margin: 8px 0 0;
        padding: 8px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 3px;
        color: var(--dim);
        font-size: 11px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 320px;
        overflow: auto;
      }
      .log-spill { margin-top: 6px; }
      .spill-head { color: var(--slow); cursor: pointer; font-size: 11px; overflow-wrap: anywhere; }
      /* a compaction boundary: one label across the stream, the summary on click */
      .log-divider { display: grid; gap: 4px; padding: 8px 0 2px; }
      .divider-rule {
        display: block;
        color: var(--dim);
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-align: center;
        border-top: 1px dashed var(--line);
        padding-top: 6px;
      }
      .divider-summary > .divider-head { color: var(--dim); cursor: pointer; font-size: 11px; text-align: center; }
      /* the row a search hit landed on */
      .log-row.hit { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
      .log-hit {
        color: var(--bg);
        background: var(--accent);
        border-radius: 2px;
        font-size: 9px;
        letter-spacing: 0.1em;
        padding: 0 4px;
        text-transform: uppercase;
      }
      /* the browser tab: search box on top, jump list, then rail + pane */
      .browser { display: grid; gap: 10px; }
      .browser-search { gap: 8px; }
      .hits { display: grid; gap: 4px; }
      .hit-rows { display: grid; gap: 2px; max-height: 220px; overflow: auto; }
      .hit {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 3px;
        color: var(--ink);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        padding: 4px 8px;
        text-align: left;
      }
      .hit:hover { border-color: var(--accent); }
      .hit-space { color: var(--accent); font-size: 11px; }
      .hit-at { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
      .hit-text { flex: 1 1 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .browser-body { display: grid; grid-template-columns: minmax(190px, 240px) 1fr; gap: 12px; align-items: start; }
      .rail { display: grid; gap: 6px; }
      .rail-head {
        margin: 0;
        color: var(--dim);
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .rail-cards { display: grid; gap: 4px; }
      .space-card {
        display: grid;
        gap: 2px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--ink);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        padding: 6px 8px;
        text-align: left;
      }
      .space-card.selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
      .space-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
      .space-title { font-weight: 600; }
      .space-meta { color: var(--dim); font-size: 10px; font-variant-numeric: tabular-nums; }
      .pane { display: grid; gap: 6px; min-width: 0; }
      .pane-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
      .pane-title { margin: 0; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; }
      @media (max-width: 760px) { .browser-body { grid-template-columns: 1fr; } }
      /* --- the PROJECTS view ------------------------------------------- */
      /* A project is a room bound to a conversation: one block per project,
         name and state on one line, then the room, the directory, and the
         first line of its AGENTS.md. The directory wraps; it is a real path. */
      .projects { align-content: start; }
      .project-list { display: grid; gap: 12px; }
      .project { border-top: 1px solid var(--line); padding-top: 8px; }
      .project:first-child { border-top: none; padding-top: 0; }
      .project-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      .project-head .badge { margin-top: 0; }
      .project-name { color: var(--accent); font-weight: 600; }
      .project-line, .project-dir, .project-summary { font-size: 11px; }
      .project-line { color: var(--dim); font-variant-numeric: tabular-nums; }
      .project-dir { color: var(--dim); overflow-wrap: anywhere; }
      .project-summary { color: var(--ink); }
      .agent-projects { margin: 10px 0 0; padding-top: 8px; border-top: 1px solid var(--line); font-size: 11px; color: var(--dim); }
      .foot { margin-top: 20px; color: var(--dim); font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      // gleam's compiled `main` is exported, not self-invoked: mount the app here.
      import { main } from "./js/wall/wall.mjs";
      main();
    </script>
  </body>
</html>
